<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Shop | Shopping Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Full Screen Loading Spinner -->
  <div class="loader-overlay" id="loading-spinner">
    <div class="spinner"></div>
  </div>

  <!-- Toast Notification Center -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Navigation Bar -->
  <header class="navbar glass">
    <div class="container nav-container">
      <a href="/index.html" class="logo">
        <i class="fa-solid fa-bolt"></i>
        <span>E-Shop</span>
      </a>

      <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/shop.html">Shop</a>
      </nav>

      <div class="search-bar-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="global-search" placeholder="Search products..." autocomplete="off">
        <div class="search-suggestions" id="search-suggestions-box"></div>
      </div>

      <div class="nav-icons">
        <button id="theme-toggle" title="Toggle Light/Dark Mode">
          <i class="fa-solid fa-moon"></i>
        </button>

        <a href="/cart.html" id="cart-nav-btn" class="active" title="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-icon-badge" id="cart-badge-count">0</span>
        </a>

        <a href="/profile.html" id="profile-nav-btn" class="hidden" title="User Profile">
          <i class="fa-solid fa-circle-user"></i>
        </a>

        <a href="/admin.html" id="admin-nav-btn" class="hidden" title="Admin Dashboard">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </a>

        <a href="/login.html" id="login-nav-btn" title="Sign In">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Shopping Cart Layout -->
  <main class="container">
    <h1 style="margin: 2rem 0 0.5rem; font-size: 2.2rem; font-weight: 800;">Shopping Cart</h1>
    
    <div class="cart-layout" id="cart-page-content">
      <!-- Items column -->
      <div class="cart-items-container" id="cart-items-list">
        <!-- Loaded dynamically via JS -->
      </div>

      <!-- Summary column -->
      <div class="cart-summary glass" id="cart-summary-card">
        <h2 class="summary-title">Order Summary</h2>
        
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">₹0.00</span>
        </div>

        <div class="summary-row">
          <span>Estimated Tax (8%)</span>
          <span id="summary-tax">₹0.00</span>
        </div>

        <div class="summary-row">
          <span>Shipping Charges</span>
          <span id="summary-shipping">Free</span>
        </div>

        <div class="summary-row" id="coupon-row" style="display: none; color: var(--success); font-weight: 600;">
          <span>Discount (20% Off)</span>
          <span id="coupon-discount-amount">-₹0.00</span>
        </div>

        <div class="coupon-group">
          <input type="text" id="coupon-input" placeholder="Promo code (SAVE20)" autocomplete="off">
          <button id="apply-coupon-btn" class="btn-secondary" style="padding: 0.5rem 1rem;">Apply</button>
        </div>

        <div class="summary-row total">
          <span>Total Price</span>
          <span id="summary-total">₹0.00</span>
        </div>

        <button id="checkout-btn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1.5rem; padding: 1rem;">
          Proceed to Checkout <i class="fa-solid fa-credit-card"></i>
        </button>
      </div>
    </div>

    <!-- Empty cart view -->
    <div id="cart-empty-view" style="display: none; text-align: center; padding: 5rem 0;">
      <i class="fa-solid fa-cart-shopping" style="font-size: 4rem; color: var(--text-muted); margin-bottom: 1.5rem;"></i>
      <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">Your Cart is Empty</h2>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Looks like you haven't added anything to your cart yet.</p>
      <a href="/shop.html" class="btn-primary">Browse Shop Catalog</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 E-Shop Inc. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
