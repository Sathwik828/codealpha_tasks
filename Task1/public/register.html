<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Shop | Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Full Screen Loading Spinner -->
  <div class="loader-overlay" id="loading-spinner">
    <div class="spinner"></div>
  </div>

  <!-- Toast Notification Center -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Navigation Bar -->
  <header class="navbar glass">
    <div class="container nav-container">
      <a href="/index.html" class="logo">
        <i class="fa-solid fa-bolt"></i>
        <span>E-Shop</span>
      </a>

      <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/shop.html">Shop</a>
      </nav>

      <div class="search-bar-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="global-search" placeholder="Search products..." autocomplete="off">
        <div class="search-suggestions" id="search-suggestions-box"></div>
      </div>

      <div class="nav-icons">
        <button id="theme-toggle" title="Toggle Light/Dark Mode">
          <i class="fa-solid fa-moon"></i>
        </button>

        <a href="/cart.html" id="cart-nav-btn" title="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-icon-badge" id="cart-badge-count">0</span>
        </a>

        <a href="/profile.html" id="profile-nav-btn" class="hidden" title="User Profile">
          <i class="fa-solid fa-circle-user"></i>
        </a>

        <a href="/admin.html" id="admin-nav-btn" class="hidden" title="Admin Dashboard">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </a>

        <a href="/login.html" id="login-nav-btn" title="Sign In">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Register Form Section -->
  <main class="auth-page">
    <div class="auth-card glass">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Join us to access exclusive features, track shipments and speed up checkouts</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 000-0000">
        </div>
        
        <div class="form-group">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="Create a secure password" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required>
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
          Get Started <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>
      
      <div class="auth-footer">
        <p>Already have an account? <a href="/login.html">Sign In Here</a></p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 E-Shop Inc. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
